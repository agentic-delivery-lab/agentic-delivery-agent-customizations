name: primitives-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ARCHITECTURE_REPORT_SCHEMA: architecture-authority/architecture/contracts/evaluation-report.schema.json
      ARCHITECTURE_AUTHORITY_ROOT: ${{ github.workspace }}/architecture-authority
    steps:
      - name: Check out primitives
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 12.3.4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Install Primitive validator dependencies
        run: pnpm install --frozen-lockfile
      - name: Read pinned Architecture release-manifest commit
        id: architecture-pin
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from 'node:fs/promises';
          const release = JSON.parse(await readFile('manifests/primitive-release.json', 'utf8'));
          const commit = release.architecture?.releaseManifestCommit;
          if (!/^[0-9a-f]{40}$/.test(commit ?? '')) throw new Error('Architecture release manifest commit must be an immutable SHA');
          process.stdout.write(`manifestCommit=${commit}\n`);
          NODE
      - name: Check out pinned Architecture Authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: agentic-delivery-lab/agentic-delivery-architecture
          ref: ${{ steps.architecture-pin.outputs.manifestCommit }}
          path: architecture-authority
          fetch-depth: 0
          persist-credentials: false
      - name: Validate primitive catalog
        run: pnpm primitive:check
      - name: Validate history-preserving extraction manifest
        run: pnpm migration:check
      - name: Replay pinned offline evaluations and retain the report
        run: pnpm evaluation:replay > "${RUNNER_TEMP}/offline-evaluation-report.json"
      - name: Upload the synthetic evaluation report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-evaluation-report
          path: ${{ runner.temp }}/offline-evaluation-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Run primitive tests
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), "Workspace profile requires Python 3.12+"'
          command -v findmnt
          pnpm test
